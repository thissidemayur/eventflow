global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "eventflow-api"
    static_configs:
      - targets: ["api:3000"]
    metrics_path: /api/v1/metrics
    scrape_interval: 15s

  - job_name: "eventflow-worker"
    static_configs:
      - targets: ["worker:9091"]
    metrics_path: /metrics
    scrape_interval: 15s