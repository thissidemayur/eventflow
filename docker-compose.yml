# version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: eventflow_postgres
    environment:
      POSTGRES_USER: eventflow
      POSTGRES_PASSWORD: eventflow
      POSTGRES_DB: eventflow
    ports:
      - "5432:5432"
    volumes:
      - "postgres_data:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventflow"]
      interval: 5s
      timeout: 5s

  redis:
    image: redis:7-alpine
    container_name: eventflow_redis
    ports:
    - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
  
  migrate:
    build:
      context: .
      dockerfile: app/api/Dockerfile
      args:
        DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
    command: sh -c "npx prisma migrate deploy "
    environment:
      DATABASE_URL: postgresql://eventflow:eventflow@postgres:5432/eventflow
    depends_on:
      postgres:
        condition: service_healthy

  api: 
    build:
      context: .
      dockerfile: app/api/Dockerfile
      
      args:
        DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://eventflow:eventflow@postgres:5432/eventflow
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: "unless-stopped"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: app/worker/Dockerfile
      args:
        DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
    environment:
      DATABASE_URL: postgresql://eventflow:eventflow@postgres:5432/eventflow
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: "unless-stopped"


volumes:
  postgres_data:
  redis_data:
